name: GeoTask AI CI

# Runs only when files in the Flutter app change, so it won't interfere with
# the web TaskFlow app at the repo root.
on:
  push:
    paths:
      - "geotask_ai/**"
      - ".github/workflows/geotask-ci.yml"
  pull_request:
    paths:
      - "geotask_ai/**"
      - ".github/workflows/geotask-ci.yml"
  workflow_dispatch: {} # lets you run it manually from the Actions tab

jobs:
  analyze-and-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geotask_ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create placeholder .env
        # pubspec lists .env as an asset; CI doesn't need real secrets to
        # analyze/test, so we supply a placeholder copy.
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting (informational)
        # Non-blocking: surfaces formatting suggestions without failing the
        # build over cosmetic differences.
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        # Fail on real problems (warnings + errors); allow info-level lints and
        # third-party deprecation notices through so they don't block the build.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded
