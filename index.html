<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — AI To-Do</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✓</span> TaskFlow</div>

      <div class="nav-section">Views</div>
      <nav class="nav">
        <button class="nav-item" data-view="list"><span>📃 List</span></button>
        <button class="nav-item" data-view="board"><span>📋 Board</span></button>
        <button class="nav-item" data-view="calendar"><span>📅 Calendar</span></button>
      </nav>

      <div class="nav-section">Insights</div>
      <nav class="nav">
        <button id="stats-toggle" class="nav-item"><span>📈 Stats</span></button>
        <button id="notes-toggle" class="nav-item"><span>📝 Notes</span></button>
        <button id="meeting-toggle" class="nav-item"><span>🎙️ Meeting</span></button>
      </nav>

      <div class="nav-section">Projects</div>
      <nav id="project-nav" class="nav project-nav"></nav>

      <button id="theme-toggle" class="nav-item theme-toggle"><span>🌙 Dark mode</span></button>
    </aside>

    <main class="main">
      <div class="main-inner">
        <header class="main-header">
          <h1 id="view-title">All tasks</h1>
          <span id="task-counter" class="task-counter"></span>
        </header>

        <input
          id="search"
          class="search"
          type="text"
          placeholder="🔍 Search tasks…"
          autocomplete="off"
        />

        <form id="new-task-form" class="new-task">
          <input
            id="new-task-input"
            type="text"
            placeholder="Add a task… try '#Work email Sara tomorrow'"
            autocomplete="off"
            required
          />
          <button type="submit">Add</button>
        </form>

        <div class="ai-generate">
          <input
            id="ai-goal-input"
            type="text"
            placeholder="Or describe a goal, e.g. Plan a birthday party"
            autocomplete="off"
          />
          <button id="ai-generate-btn" type="button">✨ Generate</button>
        </div>

        <div class="ai-ask">
          <input
            id="ai-ask-input"
            type="text"
            placeholder="Ask about your tasks, e.g. What should I do first?"
            autocomplete="off"
          />
          <button id="ai-ask-btn" type="button">Ask</button>
        </div>
        <p id="ai-answer" class="ai-answer" hidden></p>
        <p id="ai-status" class="ai-status" hidden></p>

        <div class="list-tools">
          <button id="ai-prioritize-btn" type="button">🔼 Prioritize</button>
          <button id="ai-score-btn" type="button">📊 Score</button>
          <button id="ai-schedule-btn" type="button">🗓️ Plan week</button>
          <button id="ai-organize-btn" type="button">📥 Organize</button>
          <button id="ai-projectcheck-btn" type="button">🔮 Project check</button>
        </div>

        <div id="stats-panel" class="panel" hidden></div>

        <div id="notes-panel" class="panel" hidden>
          <div class="note-form">
            <input id="note-title" type="text" placeholder="Note title" autocomplete="off" />
            <input id="note-project" type="text" placeholder="Project (optional)" autocomplete="off" />
            <textarea id="note-body" placeholder="Write a note… (ideas, links, plans)"></textarea>
            <div class="note-form-actions">
              <button id="note-add" type="button">Add note</button>
              <button id="note-summarize" type="button" class="ghost">✨ Summarize notes</button>
            </div>
          </div>
          <ul id="notes-list" class="notes-list"></ul>
        </div>

        <div id="meeting-panel" class="panel" hidden>
          <textarea id="meeting-notes" placeholder="Paste meeting notes or a transcript…"></textarea>
          <button id="meeting-extract" type="button">Extract action items</button>
        </div>

        <ul id="task-list" class="task-list"></ul>
        <div id="board" class="board" hidden></div>
        <div id="calendar" class="calendar" hidden></div>

        <div class="list-footer">
          <button id="clear-completed-btn" class="clear-completed" type="button" hidden>
            Clear completed
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
