<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>

    <form id="new-task-form" class="new-task">
      <input
        id="new-task-input"
        type="text"
        placeholder="What do you need to do?"
        autocomplete="off"
        required
      />
      <button type="submit">Add</button>
    </form>

    <div class="ai-generate">
      <input
        id="ai-goal-input"
        type="text"
        placeholder="Or describe a goal, e.g. Plan a birthday party"
        autocomplete="off"
      />
      <button id="ai-generate-btn" type="button">✨ Generate</button>
    </div>
    <p id="ai-status" class="ai-status" hidden></p>

    <div class="list-tools">
      <button id="ai-prioritize-btn" type="button">🔼 Prioritize with AI</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <div class="list-footer">
      <span id="task-counter" class="task-counter"></span>
      <button id="clear-completed-btn" class="clear-completed" type="button" hidden>
        Clear completed
      </button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
