<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — AI To-Do</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✓</span> TaskFlow</div>

      <button id="add-task-btn" class="add-task-btn">＋ Add task</button>

      <div class="nav-section">Views</div>
      <nav class="nav">
        <button class="nav-item" data-view="list"><span>📃 List</span></button>
        <button class="nav-item" data-view="board"><span>📋 Board</span></button>
        <button class="nav-item" data-view="calendar"><span>📅 Calendar</span></button>
      </nav>

      <div class="nav-section">Insights</div>
      <nav class="nav">
        <button class="nav-item insight" data-panel="stats"><span>📈 Stats</span></button>
        <button class="nav-item insight" data-panel="notes"><span>📝 Notes</span></button>
        <button class="nav-item insight" data-panel="meeting"><span>🎙️ Meeting</span></button>
      </nav>

      <div class="nav-section">Smart lists</div>
      <nav class="nav">
        <button class="nav-item smart" data-smart="today"><span>📌 Today</span></button>
        <button class="nav-item smart" data-smart="overdue"><span>⚠️ Overdue</span></button>
        <button class="nav-item smart" data-smart="upcoming"><span>🔜 Upcoming</span></button>
      </nav>

      <div class="nav-section">Projects</div>
      <nav id="project-nav" class="nav project-nav"></nav>

      <button id="theme-toggle" class="nav-item theme-toggle"><span>🌙 Dark mode</span></button>
    </aside>

    <main class="main">
      <div class="main-inner">
        <div class="topbar">
          <input
            id="search"
            class="search"
            type="text"
            placeholder="🔍 Search your tasks…"
            autocomplete="off"
          />
        </div>

        <header class="main-header">
          <h1 id="view-title">All tasks</h1>
          <span id="task-counter" class="task-counter"></span>
        </header>

        <p id="ai-status" class="ai-status" hidden></p>
        <p id="ai-answer" class="ai-answer" hidden></p>

        <!-- Task workspace: shown when a view (list/board/calendar) is active -->
        <div id="workspace">
          <form id="new-task-form" class="new-task">
            <input
              id="new-task-input"
              type="text"
              placeholder="Add a task… try '#Work email Sara tomorrow'"
              autocomplete="off"
              required
            />
            <button type="submit">Add</button>
          </form>

          <div class="ai-generate">
            <input
              id="ai-goal-input"
              type="text"
              placeholder="Or describe a goal, e.g. Plan a birthday party"
              autocomplete="off"
            />
            <button id="ai-generate-btn" type="button">✨ Generate</button>
          </div>

          <div class="ai-ask">
            <input
              id="ai-ask-input"
              type="text"
              placeholder="Ask about your tasks, e.g. What should I do first?"
              autocomplete="off"
            />
            <button id="ai-ask-btn" type="button">Ask</button>
          </div>

          <div class="list-tools">
            <button id="ai-prioritize-btn" type="button">🔼 Prioritize</button>
            <button id="ai-score-btn" type="button">📊 Score</button>
            <button id="ai-schedule-btn" type="button">🗓️ Plan week</button>
            <button id="ai-organize-btn" type="button">📥 Organize</button>
            <button id="ai-projectcheck-btn" type="button">🔮 Project check</button>
            <button id="select-toggle" type="button">☑️ Select</button>
          </div>

          <div id="bulk-bar" class="bulk-bar" hidden>
            <span id="bulk-count">0 selected</span>
            <button data-bulk="complete" type="button">✓ Complete</button>
            <button data-bulk="todo" type="button">↩ To do</button>
            <button data-bulk="in_progress" type="button">▶ In progress</button>
            <button data-bulk="delete" type="button">🗑 Delete</button>
            <button data-bulk="clear" type="button">✕</button>
          </div>

          <ul id="task-list" class="task-list"></ul>
          <div id="board" class="board" hidden></div>
          <div id="calendar" class="calendar" hidden></div>

          <div class="list-footer">
            <button id="clear-completed-btn" class="clear-completed" type="button" hidden>
              Clear completed
            </button>
          </div>
        </div>

        <!-- Insight panels: each shown only when its sidebar item is active -->
        <div id="stats-panel" class="panel" hidden></div>

        <div id="notes-panel" class="panel" hidden>
          <div class="note-form">
            <input id="note-title" type="text" placeholder="Note title" autocomplete="off" />
            <input id="note-project" type="text" placeholder="Project (optional)" autocomplete="off" />
            <textarea id="note-body" placeholder="Write a note… (ideas, links, plans)"></textarea>
            <div class="note-form-actions">
              <button id="note-add" type="button">Add note</button>
              <button id="note-summarize" type="button" class="ghost">✨ Summarize notes</button>
            </div>
          </div>
          <ul id="notes-list" class="notes-list"></ul>
        </div>

        <div id="meeting-panel" class="panel" hidden>
          <textarea id="meeting-notes" placeholder="Paste meeting notes or a transcript…"></textarea>
          <button id="meeting-extract" type="button">Extract action items</button>
        </div>
      </div>
    </main>
  </div>

  <div id="add-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2>Add task</h2>
        <button id="modal-close" class="modal-close" type="button" aria-label="Close">✕</button>
      </div>

      <input
        id="modal-task-input"
        type="text"
        placeholder="Task name… (try '#Work email Sara tomorrow')"
        autocomplete="off"
      />

      <div class="modal-row">
        <input id="modal-due" type="date" />
        <input id="modal-project" type="text" placeholder="Project (optional)" autocomplete="off" />
      </div>

      <div class="modal-ai">
        <div class="modal-ai-label">✨ Or let AI write the tasks from an idea</div>
        <div class="modal-ai-row">
          <input id="modal-goal" type="text" placeholder="e.g. Plan a product launch" autocomplete="off" />
          <button id="modal-generate" type="button">Generate</button>
        </div>
      </div>

      <div id="modal-preview" class="modal-preview" hidden></div>

      <p id="modal-status" class="modal-status" hidden></p>

      <div class="modal-actions">
        <button id="modal-cancel" class="ghost" type="button">Cancel</button>
        <button id="modal-add" type="button">Add task</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
