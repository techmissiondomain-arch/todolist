name: geotask_ai
description: "GeoTask AI - a smart to-do list with location-based reminders and AI task creation."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State management (simple & beginner-friendly) ---
  provider: ^6.1.2

  # --- Backend: auth + Postgres database + realtime ---
  supabase_flutter: ^2.5.6

  # --- AI parsing (HTTP call to our Supabase Edge Function) ---
  http: ^1.2.1

  # --- Location + geofencing ---
  # geolocator provides position streaming AND a built-in Android foreground
  # service, so we do our own arrive/leave/dwell detection (see
  # geofencing_service.dart). This keeps the API stable and dependency-light.
  geolocator: ^12.0.0            # position stream + permissions + bg service
  permission_handler: ^11.3.1    # clear, granular runtime permissions

  # --- Maps / location picker ---
  google_maps_flutter: ^2.6.1
  geocoding: ^3.0.0              # turn an address/name into lat/lng

  # --- Local push notifications ---
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4              # for scheduled (time-based) reminders

  # --- Config / misc ---
  flutter_dotenv: ^5.1.0       # load .env at runtime (dev convenience)
  intl: ^0.19.0                # date formatting
  uuid: ^4.4.0
  shared_preferences: ^2.2.3   # remember "onboarding seen"
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - .env

# ----------------------------------------------------------------------
# App icon — run:  dart run flutter_launcher_icons
# (bootstrap.* does this automatically after `flutter create`)
# Source PNGs are generated by tool/gen_icons.js (committed under assets/icon).
# ----------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#0E9F8E"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"

# ----------------------------------------------------------------------
# Splash screen — run:  dart run flutter_native_splash:create
# ----------------------------------------------------------------------
flutter_native_splash:
  color: "#0E9F8E"
  image: "assets/icon/app_icon_fg.png"
  android_12:
    color: "#0E9F8E"
    image: "assets/icon/app_icon_fg.png"
